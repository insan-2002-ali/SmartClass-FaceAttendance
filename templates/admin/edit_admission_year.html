{% extends "base.html" %}

{% block title %}
Edit Admission Year
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h4>Edit Admission Year</h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Admission Year

                    </label>

                    <input
                        type="number"
                        name="year"
                        class="form-control"
                        min="2000"
                        max="2100"
                        value="{{ year.year }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select"
                        required
                    >

                        <option value="Active"
                            {% if year.status == "Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                            {% if year.status == "Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >

                    Update

                </button>

                <a
                    href="{{ url_for('admission_year.admission_years') }}"
                    class="btn btn-secondary"
                >

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
