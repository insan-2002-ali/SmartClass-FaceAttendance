{% extends "base.html" %}

{% block title %}
Edit Student Enrollment
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Student Enrollment

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Student

                    </label>

                    <select
                        name="student_id"
                        class="form-select"
                        required>

                        {% for student in students %}

                        <option
                            value="{{ student.id }}"
                            {% if student.id==enrollment.student_id %}
                            selected
                            {% endif %}>

                            {{ student.student_id }} - {{ student.full_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Teacher Assignment

                    </label>

                    <select
                        name="teacher_assignment_id"
                        class="form-select"
                        required>

                        {% for assignment in assignments %}

                        <option
                            value="{{ assignment.id }}"
                            {% if assignment.id==enrollment.teacher_assignment_id %}
                            selected
                            {% endif %}>

                            {{ assignment.subject_name }}
                            |
                            {{ assignment.teacher_name }}
                            |
                            {{ assignment.department_name }}
                            |
                            Year {{ assignment.year }}
                            |
                            Semester {{ assignment.semester }}
                            |
                            Section {{ assignment.section }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option
                            value="Active"
                            {% if enrollment.status=="Active" %}
                            selected
                            {% endif %}>

                            Active

                        </option>

                        <option
                            value="Inactive"
                            {% if enrollment.status=="Inactive" %}
                            selected
                            {% endif %}>

                            Inactive

                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Update Enrollment

                </button>

                <a
                    href="{{ url_for('student_enrollment.student_enrollments') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
