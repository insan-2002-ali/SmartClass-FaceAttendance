{% extends "base.html" %}

{% block title %}
Add Department
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">

                        <i class="bi bi-plus-circle"></i>

                        Add Department

                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">

                                Program <span class="text-danger">*</span>

                            </label>

                            <select
                                name="program_id"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Program
                                </option>

                                {% for program in programs %}

                                <option value="{{ program.id }}">

                                    {{ program.admission_year }}
                                    -
                                    {{ program.program_code }}
                                    -
                                    {{ program.program_name }}
                                    ({{ program.degree }})

                                </option>

                                {% endfor %}

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Department Code

                            </label>

                            <input
                                type="text"
                                name="department_code"
                                class="form-control"
                                placeholder="Example: CSE"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Department Name

                            </label>

                            <input
                                type="text"
                                name="department_name"
                                class="form-control"
                                placeholder="Computer Science and Engineering"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Description

                            </label>

                            <textarea
                                name="description"
                                rows="4"
                                class="form-control"
                                placeholder="Department Description"
                            ></textarea>

                        </div>
                                                <div class="mb-3">

                            <label class="form-label">

                                Status <span class="text-danger">*</span>

                            </label>

                            <select
                                name="status"
                                class="form-select"
                                required
                            >

                                <option value="Active" selected>
                                    Active
                                </option>

                                <option value="Inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('department.departments') }}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>

                                Save Department

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
