{% extends "base.html" %}

{% block title %}
Add Subject
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-book-fill"></i>

                Add Subject

            </h3>

        </div>

        <div class="card-body">

            <form
                method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Subject Code

                    </label>

                    <input
                        type="text"
                        name="subject_code"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Subject Name

                    </label>

                    <input
                        type="text"
                        name="subject_name"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Credit

                    </label>

                    <input
                        type="number"
                        step="0.5"
                        name="credit"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"></textarea>

                </div>
                                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">

                            Active

                        </option>

                        <option value="Inactive">

                            Inactive

                        </option>

                    </select>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-save"></i>

                        Save Subject

                    </button>

                    <a
                        href="{{ url_for('subject.subjects') }}"
                        class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>

                        Back

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
