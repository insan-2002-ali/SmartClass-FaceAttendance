{% extends "base.html" %}

{% block title %}
Edit Program
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h4>Edit Program</h4>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Admission Year

                    </label>

                    <select
                        name="admission_year_id"
                        class="form-select"
                        required>

                        {% for year in years %}

                        <option
                            value="{{ year.id }}"
                            {% if year.id == program.admission_year_id %}selected{% endif %}>

                            {{ year.year }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Program Code

                    </label>

                    <input
                        type="text"
                        name="program_code"
                        class="form-control"
                        maxlength="2"
                        value="{{ program.program_code }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Program Name

                    </label>

                    <input
                        type="text"
                        name="program_name"
                        class="form-control"
                        value="{{ program.program_name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Degree

                    </label>

                    <select
                        name="degree"
                        class="form-select">

                        <option value="Bachelor"
                            {% if program.degree == "Bachelor" %}selected{% endif %}>

                            Bachelor

                        </option>

                        <option value="Master"
                            {% if program.degree == "Master" %}selected{% endif %}>

                            Master

                        </option>

                        <option value="PhD"
                            {% if program.degree == "PhD" %}selected{% endif %}>

                            PhD

                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active"
                            {% if program.status == "Active" %}selected{% endif %}>

                            Active

                        </option>

                        <option value="Inactive"
                            {% if program.status == "Inactive" %}selected{% endif %}>

                            Inactive

                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Update

                </button>

                <a
                    href="{{ url_for('program.programs') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
