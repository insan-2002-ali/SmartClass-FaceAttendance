{% extends "base.html" %}

{% block title %}
Edit Teacher Assignment
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Teacher Assignment

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Teacher

                        </label>

                        <select
                            name="teacher_id"
                            class="form-select"
                            required>

                            {% for teacher in teachers %}

                            <option
                                value="{{ teacher.id }}"
                                {% if teacher.id==assignment.teacher_id %}
                                selected
                                {% endif %}>

                                {{ teacher.full_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Department

                        </label>

                        <select
                            name="department_id"
                            class="form-select"
                            required>

                            {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if department.id==assignment.department_id %}
                                selected
                                {% endif %}>

                                {{ department.department_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Subject

                        </label>

                        <select
                            name="subject_id"
                            class="form-select"
                            required>

                            {% for subject in subjects %}

                            <option
                                value="{{ subject.id }}"
                                {% if subject.id==assignment.subject_id %}
                                selected
                                {% endif %}>

                                {{ subject.subject_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Admission Year

                        </label>

                        <select
                            name="admission_year_id"
                            class="form-select"
                            required>

                            {% for year in admission_years %}

                            <option
                                value="{{ year.id }}"
                                {% if year.id==assignment.admission_year_id %}
                                selected
                                {% endif %}>

                                {{ year.year }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Semester

                        </label>

                        <select
                            name="semester"
                            class="form-select"
                            required>

                            {% for i in range(1,9) %}

                            <option
                                value="{{ i }}"
                                {% if assignment.semester|string==i|string %}
                                selected
                                {% endif %}>

                                Semester {{ i }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Section

                        </label>

                        <input
                            type="text"
                            name="section"
                            class="form-control"
                            value="{{ assignment.section }}"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Academic Year

                        </label>

                        <input
                            type="text"
                            name="academic_year"
                            class="form-control"
                            value="{{ assignment.academic_year }}"
                            required>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option
                            value="Active"
                            {% if assignment.status=="Active" %}
                            selected
                            {% endif %}>

                            Active

                        </option>

                        <option
                            value="Inactive"
                            {% if assignment.status=="Inactive" %}
                            selected
                            {% endif %}>

                            Inactive

                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Update Assignment

                </button>

                <a
                    href="{{ url_for('teacher_assignment.teacher_assignments') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
