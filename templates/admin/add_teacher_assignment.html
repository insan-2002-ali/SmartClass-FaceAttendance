{% extends "base.html" %}

{% block title %}
Assign Teacher
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-diagram-3-fill"></i>

                Assign Teacher

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Teacher

                    </label>

                    <select
                        name="teacher_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Teacher
                        </option>

                        {% for teacher in teachers %}

                        <option value="{{ teacher.id }}">

                            {{ teacher.full_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Department

                    </label>

                    <select
                        name="department_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Department
                        </option>

                        {% for department in departments %}

                        <option value="{{ department.id }}">

                            {{ department.department_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Subject

                    </label>

                    <select
                        name="subject_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Subject
                        </option>

                        {% for subject in subjects %}

                        <option value="{{ subject.id }}">

                            {{ subject.subject_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Admission Year

                    </label>

                    <select
                        name="admission_year_id"
                        class="form-select"
                        required>

                        <option value="">
                            Select Admission Year
                        </option>

                        {% for year in admission_years %}

                        <option value="{{ year.id }}">

                            {{ year.year }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Semester

                    </label>

                    <select
                        name="semester"
                        class="form-select"
                        required>

                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Section

                    </label>

                    <input
                        type="text"
                        name="section"
                        class="form-control"
                        placeholder="A / B / C"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Academic Year

                    </label>

                    <input
                        type="text"
                        name="academic_year"
                        class="form-control"
                        placeholder="2026-2027"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">

                            Active

                        </option>

                        <option value="Inactive">

                            Inactive

                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Save Assignment

                </button>

                <a
                    href="{{ url_for('teacher_assignment.teacher_assignments') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
