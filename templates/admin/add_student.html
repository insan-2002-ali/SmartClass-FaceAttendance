{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="bi bi-person-plus-fill"></i>

                Add Student

            </h3>

        </div>

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Student ID

                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            required>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Phone

                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control">

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Gender

                        </label>

                        <select
                            name="gender"
                            class="form-select"
                            required>

                            <option value="Male">Male</option>

                            <option value="Female">Female</option>

                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Department

                        </label>

                        <select
                            name="department_id"
                            class="form-select"
                            required>

                            <option value="">

                                Select Department

                            </option>

                            {% for department in departments %}

                            <option value="{{ department.id }}">

                                {{ department.department_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                    <label class="form-label">

                        Program

                    </label>

                    <select
                        name="program_id"
                        class="form-select"
                        required>

                        <option value="">

                            Select Program

                        </option>

                        {% for program in programs %}

                        <option value="{{ program.id }}">

                            {{ program.program_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                </div>


                <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Date of Birth

                            </label>

                            <input
                                type="date"
                                name="date_of_birth"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                        </div>

                    </div>


                <div class="mb-3">

                    <label class="form-label">

                        Profile Photo

                    </label>

                    <input
                        type="file"
                        name="profile_photo"
                        class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">

                            Active

                        </option>

                        <option value="Inactive">

                            Inactive

                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Save Student

                </button>

                <a
                    href="{{ url_for('student.students') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
