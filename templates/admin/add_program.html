{% extends "base.html" %}

{% block title %}
Add Program
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4>Add Program</h4>

        </div>

        <div class="card-body">

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">

                        Admission Year

                    </label>

                    <select
                        name="admission_year_id"
                        class="form-select"
                        required>

                        <option value="">Select Admission Year</option>

                        {% for year in years %}

                        <option value="{{ year.id }}">

                            {{ year.year }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Program Code

                    </label>

                    <input
                        type="text"
                        name="program_code"
                        class="form-control"
                        maxlength="2"
                        placeholder="CS"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Program Name

                    </label>

                    <input
                        type="text"
                        name="program_name"
                        class="form-control"
                        placeholder="Computer Science and Technology"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Degree

                    </label>

                    <select
                        name="degree"
                        class="form-select">

                        <option value="Bachelor">

                            Bachelor

                        </option>

                        <option value="Master">

                            Master

                        </option>

                        <option value="PhD">

                            PhD

                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Active">

                            Active

                        </option>

                        <option value="Inactive">

                            Inactive

                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Save

                </button>

                <a
                    href="{{ url_for('program.programs') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
