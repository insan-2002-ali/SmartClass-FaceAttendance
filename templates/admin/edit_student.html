{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>

                <i class="bi bi-pencil-square"></i>

                Edit Student

            </h3>

        </div>

        <div class="card-body">

            <form
                method="POST"
                enctype="multipart/form-data">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            class="form-control"
                            value="{{ student.student_id }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="form-control"
                            value="{{ student.full_name }}"
                            required>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student.phone }}">

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Gender
                        </label>

                        <select
                            name="gender"
                            class="form-select">

                            <option value="Male"
                            {% if student.gender=="Male" %}selected{% endif %}>
                                Male
                            </option>

                            <option value="Female"
                            {% if student.gender=="Female" %}selected{% endif %}>
                                Female
                            </option>

                            <option value="Other"
                            {% if student.gender=="Other" %}selected{% endif %}>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Program
                        </label>

                        <select
                            name="program_id"
                            class="form-select"
                            required>

                            {% for program in programs %}

                            <option
                                value="{{ program.id }}"
                                {% if program.id==student.program_id %}selected{% endif %}>

                                {{ program.program_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <select
                            name="department_id"
                            class="form-select"
                            required>

                            {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if department.id==student.department_id %}selected{% endif %}>

                                {{ department.department_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            name="date_of_birth"
                            class="form-control"
                            value="{{ student.date_of_birth }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Active"
                            {% if student.status=="Active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="Inactive"
                            {% if student.status=="Inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Profile Photo
                    </label>

                    <input
                        type="file"
                        name="profile_photo"
                        class="form-control">

                    {% if student.profile_photo %}

                    <img
                        src="{{ url_for('static', filename='uploads/' ~ student.profile_photo) }}"
                        width="100"
                        class="mt-3 rounded border">

                    {% endif %}

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-save"></i>

                    Update Student

                </button>

                <a
                    href="{{ url_for('student.students') }}"
                    class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
