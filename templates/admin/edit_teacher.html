{% extends "base.html" %}

{% block title %}Edit Teacher{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Teacher</h3>
        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Teacher ID</label>
                    <input type="text" class="form-control"
                           name="teacher_id"
                           value="{{ teacher.teacher_id }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control"
                           name="full_name"
                           value="{{ teacher.full_name }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control"
                           name="email"
                           value="{{ teacher.email }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control"
                           name="phone"
                           value="{{ teacher.phone }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>

                    <select class="form-select" name="gender">

                        <option value="Male"
                        {% if teacher.gender=="Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                        {% if teacher.gender=="Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                        {% if teacher.gender=="Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Designation</label>
                    <input type="text"
                           class="form-control"
                           name="designation"
                           value="{{ teacher.designation }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>

                    <select class="form-select"
                            name="department_id">

                        {% for department in departments %}

                        <option value="{{ department.id }}"
                        {% if department.id == teacher.department_id %}selected{% endif %}>

                            {{ department.department_name }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select class="form-select"
                            name="status">

                        <option value="Active"
                        {% if teacher.status=="Active" %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                        {% if teacher.status=="Inactive" %}selected{% endif %}>
                            Inactive
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Current Photo
                    </label>

                    <br>

                    {% if teacher.profile_photo %}

                    <img src="{{ url_for('static', filename='uploads/' ~ teacher.profile_photo) }}"
                         width="120"
                         class="img-thumbnail">

                    {% else %}

                    <p class="text-muted">
                        No Photo Available
                    </p>

                    {% endif %}

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Upload New Photo
                    </label>

                    <input type="file"
                           class="form-control"
                           name="profile_photo">

                </div>

                <button type="submit"
                        class="btn btn-success">
                    Update Teacher
                </button>

                <a href="{{ url_for('teacher.teachers') }}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
