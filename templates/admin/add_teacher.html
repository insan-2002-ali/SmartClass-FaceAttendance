{% extends "base.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row">

        <div class="col-lg-8 mx-auto">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-person-plus-fill"></i>
                        Add Teacher
                    </h4>

                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        enctype="multipart/form-data">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Teacher ID
                                </label>

                                <input
                                    type="text"
                                    name="teacher_id"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    name="full_name"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select
                                    name="gender"
                                    class="form-select"
                                    required>

                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Department
                                </label>

                                <select
                                    name="department_id"
                                    class="form-select"
                                    required>

                                    {% for department in departments %}

                                    <option value="{{ department.id }}">
                                        {{ department.department_name }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Designation
                                </label>

                                <input
                                    type="text"
                                    name="designation"
                                    class="form-control">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Status
                                </label>

                                <select
                                    name="status"
                                    class="form-select">

                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Profile Photo
                                </label>

                                <input
                                    type="file"
                                    name="profile_photo"
                                    class="form-control"
                                    accept="image/*">

                            </div>

                        </div>

                        <div class="text-end">

                            <a
                                href="{{ url_for('teacher.teachers') }}"
                                class="btn btn-secondary">

                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Save Teacher

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
