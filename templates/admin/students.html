{% extends "base.html" %}

{% block content %}

<h2>Students</h2>

<a href="{{ url_for('student.add_student') }}"
   class="btn btn-primary mb-3">
    Add Student
</a>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>
<th>Student ID</th>
<th>Name</th>
<th>Department</th>
<th>Semester</th>
<th>Email</th>
<th>Phone</th>

</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{ s.id }}</td>
<td>{{ s.student_id }}</td>
<td>{{ s.full_name }}</td>
<td>{{ s.department }}</td>
<td>{{ s.semester }}</td>
<td>{{ s.email }}</td>
<td>{{ s.phone }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
